<div class="flex h-full">

  @let data = videoService.data();
  @if (data.info != null && data.state != null) {
    <div class="relative h-full bg-black flex-8/12">
      <app-sizer>
        <app-video [url]="config.birdsEyeVideoEndpoint"></app-video>

        <canvas #canvas id="canvas" class="absolute left-0 top-0 w-full h-full"
                [width]="videoService.data().info!.detectionWidth"
                [height]="videoService.data().info!.detectionHeight">

        </canvas>
      </app-sizer>
      <div class="text-white absolute left-0 top-0 bg-black">
        <ul>
          <li>
            Green - Line
          </li>
          <li>
            Orange - Selected, where new lines link to
          </li>
          <li>
            Blue - Moving
          </li>
        </ul>

        <p>
          Right click to deselect (for creating a separate path)
        </p>
        <div>
          Set speed
          <button (click)="setSpeed('NORMAL')">NORMAL</button>
          <button (click)="setSpeed('SLOW')">SLOW</button>
          <button (click)="setSpeed('STOP')">STOP</button>
        </div>

        <button (click)="deleteSelected()">Delete Selected</button>
        <button (click)="save()">Save</button>
      </div>
    </div>
  }
  <div class="flex-4/12">
    <textarea [formField]="jsonForm.json" class="h-full w-full bg-white text-black border"></textarea>
  </div>
</div>
